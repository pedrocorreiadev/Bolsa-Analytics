server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's DNS keeps the proxy working if the backend is recreated and
    # receives a new IP address. The service name stays the same.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    location ~ ^/(api(?:/|$)|health$|docs(?:/|$)|redoc(?:/|$)|openapi\.json$) {
        # Preserve both the /api prefix and the original query string.
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        # Direct links and refreshes of React routes must load the app.
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
